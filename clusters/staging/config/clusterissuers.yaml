# Let's Encrypt の証明書の発行元。ドメインの所有確認は HTTP-01 で行う
# (cert-manager が、Gateway の http リスナーに、認証用の一時的な HTTPRoute を作る)。
# 登録用のメールアドレスは省略している。更新は cert-manager が自動で行う。
# 発行数の制限に当たらないよう、最初は staging (試験用、ブラウザーは信頼しない) で動作を確認し、
# gateway.yaml の注釈を letsencrypt-prod に切り替える
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: fizzbuzz
                namespace: gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: fizzbuzz
                namespace: gateway
                sectionName: http

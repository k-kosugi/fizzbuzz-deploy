apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace はインフラ側 (Bicep) が AKS のマネージド namespace として作成している。ここでは作成しない
namespace: fizzbuzz
resources:
  - ../../apps/fizzbuzz
# 配備するイメージ。タグではなく digest で固定する。
# CI が push したイメージの digest に、このファイルを更新するとデプロイされる
images:
  - name: fizzbuzz-backend
    newName: crfizzbuzzafqpcdm4ps57m.azurecr.io/fizzbuzz-backend
    digest: sha256:647c20d2480c925400b478cecce25c23d0ad6daeb06d56ce97ac2044e1365a17
  - name: fizzbuzz-frontend
    newName: crfizzbuzzafqpcdm4ps57m.azurecr.io/fizzbuzz-frontend
    digest: sha256:8d60b294c46e177c1f1c9b014ed635dcdfe84398f96044967836a84b6fc1f0a2
